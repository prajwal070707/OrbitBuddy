version: '3.8'

services:
  
  mysql-db:
    image: mysql:8.0
    container_name: springboot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: my_app_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  
  backend-api:
    build: ./backend/orbitbuddy-spring  
    container_name: springboot-backend
    ports:
      - "8080:8080"
    environment:
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword
    depends_on:
      - mysql-db


  frontend-ui:
    build: ./frontend/orbitbuddy-ng    
    container_name: angular-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend-api

volumes:
  mysql_data: